# Apply infrastructure changes, behind a required reviewer.
#
# Two jobs, and the split is the whole point. A job-level `environment:` gate is
# evaluated BEFORE any step in that job runs, so a single gated job asks the
# reviewer to approve before the plan exists -- they are approving a description,
# not a diff. Planning in an ungated job first means the reviewer reads the
# actual plan in that job's summary and then approves the apply.
#
# The reviewer gate is the only thing standing between a bad merge and your
# infrastructure. `prevent_destroy` and `delete_protection` were deliberately
# left off the volume, so this is the protection -- and it only covers CI. A
# `terraform destroy` from a laptop never meets a reviewer.
#
# What a merge here CAN remove: the network, the firewall, the k3s install, the
# volume. What it CANNOT remove: the five servers. Those are `data` sources --
# lookups with no destroy verb, so no plan can delete one.
#
# Set up in GitHub: Settings -> Environments -> New environment "terraform-apply"
# -> Required reviewers -> add yourself. Without that step the apply job runs
# ungated, which is the failure mode this file exists to prevent.

name: Terraform Apply

on:
  # main only, deliberately.
  #
  # dev / staging / main are APPLICATION environments served by one set of
  # machines. There is a single cluster and a single state file, so applying
  # from three branches means three branches racing to define one reality: merge
  # a change to dev, then promote an older staging, and Terraform treats the
  # older branch as desired state and rolls the newer change back.
  #
  # Infrastructure has one authoritative branch. Changes still travel
  # feature -> dev -> staging -> main for review; they just take effect once.
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress. Interrupting an apply mid-write leaves state and
  # reality disagreeing, which is worse than waiting.
  group: tf-apply
  cancel-in-progress: false

env:
  # The S3 backend reads R2 credentials from the environment. Named for the S3
  # protocol, not for AWS; nothing here talks to Amazon.
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
  # Terraform needs this, not just the tailscale action below.
  #
  # The subnet router is gated on `count = var.tailscale_auth_key != ""`.
  # Leave it unset in CI and count flips to 0, so the plan DESTROYS the router
  # -- silently taking away the access this same workflow depends on.
  TF_VAR_tailscale_auth_key: ${{ secrets.TS_ROUTER_AUTHKEY }}

  # Reach the nodes over the tailnet rather than their public addresses. A
  # runner's Azure address is not in admin_cidrs and never will be; the private
  # interface needs no firewall rule at all.
  TF_VAR_connect_via: tailnet

jobs:
  # ---------------------------------------------------------------- preflight
  #
  # Terraform CI needs credentials that live only in repository secrets. Until
  # they are set, `terraform init` fails against the R2 backend with an error
  # naming an AWS service this project does not use, on a workflow that is
  # simply not set up yet.
  #
  # A red check means "your change broke something". An unconfigured workflow is
  # a different statement and deserves a different signal, or the first real
  # failure arrives looking exactly like the noise you have learned to ignore.
  #
  # The `secrets` context is not available in a job-level `if:`, which is why
  # this is a job that reports rather than a condition.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          R2_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HCLOUD: ${{ secrets.HCLOUD_TOKEN }}
          CIDRS: ${{ secrets.ADMIN_CIDRS }}
          SSH_KEY: ${{ secrets.CLUSTER_SSH_PRIVATE_KEY }}
          TS_ROUTER: ${{ secrets.TS_ROUTER_AUTHKEY }}
          TS_CI: ${{ secrets.TS_CI_AUTHKEY }}
        run: |
          missing=""
          [ -n "$R2_KEY" ]    || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "$R2_SECRET" ] || missing="$missing AWS_SECRET_ACCESS_KEY"
          [ -n "$HCLOUD" ]    || missing="$missing HCLOUD_TOKEN"
          [ -n "$CIDRS" ]     || missing="$missing ADMIN_CIDRS"
          [ -n "$SSH_KEY" ]   || missing="$missing CLUSTER_SSH_PRIVATE_KEY"
          # Required rather than optional. An empty value does not disable the
          # subnet router -- it plans its destruction, because count is derived
          # from whether the id is set.
          [ -n "$TS_ROUTER" ] || missing="$missing TS_ROUTER_AUTHKEY"
          [ -n "$TS_CI" ]     || missing="$missing TS_CI_AUTHKEY"

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Terraform CI is not configured yet"
              echo
              echo "Skipping the apply. Missing repository secrets:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "Setup: [\`infrastructure/terraform/README.md\`](infrastructure/terraform/README.md)."
              echo
              echo "Nothing was applied. Run it locally instead:"
              echo '```'
              echo "cd infrastructure/terraform/hetzner"
              echo "terraform plan -out=tfplan && terraform apply tfplan"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Terraform CI not configured; skipping apply. Missing:$missing"
          fi

  # ------------------------------------------------------------------- plan
  # Ungated on purpose: this is what the reviewer reads before approving.
  plan:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/hetzner

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan

      # k3s is installed over SSH by a provisioner, so a plan that creates or
      # destroys a terraform_data reinstalls it on that node.
      #
      # This was a hard refusal, on the grounds that the firewall admits SSH
      # only from admin_cidrs and a runner's Azure address is not in it. That
      # stopped being true in 30a3c21, when CI joined the tailnet: the apply job
      # reaches each node's PRIVATE address, where no firewall rule applies at
      # all, and proves it with a probe on port 22 before Terraform runs. The
      # refusal was turning work CI can do into work only a laptop can do --
      # which is the one place no reviewer ever sees it.
      #
      # Surfaced loudly rather than silently allowed. Reinstalling k3s on the
      # control plane takes the API server down while it runs, and the reviewer
      # should learn that here, before approving, rather than from kubectl
      # afterwards. The required reviewer is the protection; this is the
      # information they need in order to use it.
      #
      # Parsed as JSON rather than grepped. Terraform represents a replacement
      # as actions ["delete","create"], not the literal string "replace", so a
      # pattern anchored on "replace" misses exactly the case that matters: a
      # changed kubelet reservation, node label, or advertise address
      # reinstalling k3s.
      - name: Flag changes that reinstall k3s
        run: |
          terraform show -json tfplan > plan.json
          need_ssh=$(jq '[.resource_changes[]?
                          | select(.type == "terraform_data")
                          | select(.change.actions | any(. == "create" or . == "delete"))]
                         | length' plan.json)
          echo "resources reinstalling over SSH: $need_ssh"
          if [ "$need_ssh" -gt 0 ]; then
            {
              echo "> [!WARNING]"
              echo "> This plan **reinstalls k3s on $need_ssh node(s)** over SSH."
              echo "> If the control plane is among them, the API server is unavailable while it runs."
              echo
              jq -r '.resource_changes[]?
                     | select(.type == "terraform_data")
                     | select(.change.actions | any(. == "create" or . == "delete"))
                     | "- `" + .address + "`: " + (.change.actions | join(", "))' plan.json
              echo
              echo "The apply job reaches these nodes over the tailnet and probes port 22 first,"
              echo "so it fails fast with a named cause rather than hanging on an SSH timeout."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::plan reinstalls k3s on $need_ssh node(s); the API server will be briefly unavailable"
          fi

      # The reviewer approves the next job based on this. Rendered from the saved
      # plan so it is the same plan, and `terraform show` redacts values marked
      # sensitive -- which the raw tfplan file does not, and is why that file is
      # never uploaded as an artifact.
      - name: Publish the plan for the reviewer
        run: |
          {
            echo "### Terraform plan — \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`"
            echo
            echo '```terraform'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ apply
  # Gated. Runs only after a human has read the plan job's summary.
  apply:
    needs: [preflight, plan]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: terraform-apply
    defaults:
      run:
        working-directory: infrastructure/terraform/hetzner

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Present so `file(pathexpand(var.ssh_private_key_path))` resolves at plan
      # time. The plan job has already refused anything that would actually
      # connect, so this is never used to reach a node from CI -- but Terraform
      # evaluates the whole config regardless of what is changing.
      # Joins as an EPHEMERAL node, removed when the job ends. A non-ephemeral
      # key would leave one dead-but-still-authorized peer per workflow run.
      #
      # --accept-routes is not optional. Without it the runner joins the tailnet
      # and ignores the advertised 10.0.1.0/24, so every node address times out
      # -- the same symptom as an unapproved route, from a third cause.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_CI_AUTHKEY }}
          args: --accept-routes

      # Fail here, in three seconds, with a message naming the likely cause --
      # rather than in the provisioner, after a three-minute SSH timeout, with
      # a connection error that says nothing.
      - name: Confirm the cluster subnet is reachable
        run: |
          for ip in 10.0.1.10 10.0.1.11 10.0.1.12 10.0.1.13; do
            ok=0
            for i in $(seq 20); do
              if timeout 2 bash -c "cat < /dev/null > /dev/tcp/$ip/22" 2>/dev/null; then
                echo "  $ip reachable"; ok=1; break
              fi
              sleep 1
            done
            if [ "$ok" = 0 ]; then
              {
                echo "### Cannot reach $ip over the tailnet"
                echo
                echo "Check, in order:"
                echo "- the subnet route is approved (Tailscale console -> Machines -> router -> route settings)"
                echo "- the ACL lets \`tag:ci\` reach \`10.0.1.0/24:22,6443\`"
                echo "- the router node is online"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$ip unreachable over the tailnet"
              exit 1
            fi
          done

      - name: Load the cluster SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLUSTER_SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          printf 'StrictHostKeyChecking accept-new\n' >> ~/.ssh/config

      - name: Init
        run: terraform init -input=false

      # Re-planned rather than applying a file handed over from the plan job.
      #
      # A saved plan would guarantee that what runs is exactly what was reviewed,
      # which is the better property -- but the tfplan file embeds every variable
      # value it was planned with, the API token included, and an artifact is
      # readable by anyone with repo access while a secret is not. Between
      # leaking the token and a small window where state could move, the window
      # is the lesser problem: the state lock and `tf-apply` concurrency mean the
      # only thing that can move it is a human running apply by hand, right now.
      - name: Apply
        run: terraform apply -no-color -input=false -lock-timeout=5m -auto-approve

      - name: Summary
        if: always()
        run: |
          {
            echo "### Applied — \`${{ github.ref_name }}\`"
            echo
            terraform output -no-color 2>/dev/null | grep -Ev 'BEGIN|END|^\s' || true
          } >> "$GITHUB_STEP_SUMMARY"
