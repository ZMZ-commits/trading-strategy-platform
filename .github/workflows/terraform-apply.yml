# Apply on merge to a long-lived branch, behind a required reviewer.
#
# The reviewer gate is the only thing standing between a bad merge and your
# infrastructure. `prevent_destroy` and `delete_protection` were deliberately
# left off the volume, so this is the protection -- and it only covers CI. A
# `terraform destroy` from a laptop never meets a reviewer.
#
# What a merge here CAN remove: the network, the firewall, the k3s install, the
# volume, and anything in ../k8s. What it CANNOT remove: the five servers. Those
# are `data` sources -- lookups with no destroy verb, so no plan can delete one.
#
# Set up in GitHub: Settings -> Environments -> New environment "terraform-apply"
# -> Required reviewers -> add yourself. Without that step this file applies with
# no gate at all, which is the failure mode it exists to prevent.

name: Terraform Apply

on:
  push:
    branches: [dev, staging, main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress. Interrupting an apply mid-write leaves state and
  # reality disagreeing, which is worse than waiting.
  group: tf-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: terraform-apply # <- the reviewer gate lives here
    defaults:
      run:
        working-directory: infrastructure/terraform/hetzner

    # The S3 backend reads R2 credentials from the environment, and every step
    # that touches state needs them -- init, plan and apply alike. Named for the
    # S3 protocol, not for AWS; nothing here talks to Amazon.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # k3s is installed by a remote-exec provisioner, so the runner needs SSH
      # to every node. This is the real cost of provisioner-based install: the
      # thing that applies your infrastructure now holds root on all of it.
      #
      # Scope the deploy key to these machines only, and rotate it if a workflow
      # run is ever compromised.
      - name: Load the cluster SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLUSTER_SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          # The provisioner connects by IP; without this the host-key prompt
          # blocks forever on a runner with no tty.
          printf 'StrictHostKeyChecking accept-new\n' >> ~/.ssh/config

      - name: Init
        run: terraform init -input=false

      - name: Plan
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
        run: terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan

      # The firewall admits SSH only from admin_cidrs -- your home address. A
      # GitHub runner is a throwaway VM on some Azure IP, so any change that
      # makes a provisioner run (adding a node, editing a kubelet reservation or
      # a node label) cannot reach the machine and would hang until the SSH
      # timeout, then fail with a connection error that says nothing useful.
      #
      # Catch it here instead, before anything is written, and say what to do.
      # Everything that touches only the Hetzner API -- firewall rules, the
      # network, the volume -- passes straight through.
      - name: Refuse changes that need SSH
        run: |
          if terraform show -json tfplan \
             | grep -q '"type":"terraform_data"[^}]*"change":{"actions":\["create"\|"replace"'; then
            {
              echo "### Apply blocked"
              echo
              echo "This plan reinstalls or joins a k3s node, which needs SSH to the machine."
              echo "The firewall only admits \`admin_cidrs\`, and this runner is not in it."
              echo
              echo "Run it from your laptop instead:"
              echo '```'
              echo "cd infrastructure/terraform/hetzner"
              echo "terraform plan -out=tfplan && terraform apply tfplan"
              echo '```'
              echo
              echo "To make CI able to do this, use a self-hosted runner inside the"
              echo "Hetzner network -- see infrastructure/terraform/README.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::plan requires SSH to a node; apply it locally (see job summary)"
            exit 1
          fi
          echo "No provisioner in this plan - safe to apply from CI."

      # Applying the saved plan, not re-planning. Between plan and apply the
      # world can move; applying a file guarantees what ran is what the gate
      # approved.
      - name: Apply
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
        run: terraform apply -no-color -input=false -lock-timeout=5m tfplan

      - name: Summary
        if: always()
        run: |
          {
            echo "### Terraform apply — \`${{ github.ref_name }}\`"
            echo
            terraform output -no-color 2>/dev/null | grep -Ev 'BEGIN|END|^\s' || true
          } >> "$GITHUB_STEP_SUMMARY"
